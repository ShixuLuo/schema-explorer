server {
    listen 80;
    server_name schema-explorer.luo.sx;
    location ^~ /.well-known/acme-challenge/ {
        root /www/sites/schema-explorer.luo.sx/index;
        allow all;
    }
    location / { return 301 https://schema-explorer.luo.sx$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name schema-explorer.luo.sx;
    ssl_certificate /www/sites/schema-explorer.luo.sx/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/schema-explorer.luo.sx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;
    access_log /www/sites/schema-explorer.luo.sx/log/access.log main;
    error_log /www/sites/schema-explorer.luo.sx/log/error.log;
    client_max_body_size 16m;
    location / {
        proxy_pass http://127.0.0.1:5186;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 320s;
        proxy_send_timeout 320s;
        proxy_buffering off;
    }
}
