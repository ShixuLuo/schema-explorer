[package]
name = "schema-explorer"
version = "0.1.0"
edition = "2024"
description = "Dataset-independent model evolution and bounded advisor context"

[features]
default = []
server = ["dep:axum", "dep:tokio", "dep:tower-http", "dep:tower"]

[[bin]]
name = "server"
path = "src/bin/server.rs"
required-features = ["server"]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
csv = "=1.4.0"
axum = { version = "=0.8.9", optional = true }
tokio = { version = "=1.49.0", optional = true, features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tower-http = { version = "=0.6.8", optional = true, features = ["fs"] }

tower = { version = "=0.5.3", optional = true, features = ["util"] }
